name: Build Klencod Native PTY

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android PTY libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build both ABIs
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          NDK="$SDK_ROOT/ndk/27.2.12479018"
          CMAKE="$SDK_ROOT/cmake/3.22.1/bin/cmake"

          mkdir -p dist
          for ABI in arm64-v8a armeabi-v7a; do
            echo "Building $ABI..."
            "$CMAKE" \
              -S native \
              -B "build/$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-23 \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release

            "$CMAKE" --build "build/$ABI" --config Release --parallel 2

            mkdir -p "dist/$ABI"
            find "build/$ABI" -type f -name 'libklencod_pty.so' -exec cp {} "dist/$ABI/libklencod_pty.so" \;
            test -s "dist/$ABI/libklencod_pty.so"
          done

          echo "Built libraries:"
          find dist -type f -name '*.so' -print

      - name: Package libraries
        run: |
          cd dist
          zip -r ../klencod-pty-libraries.zip arm64-v8a armeabi-v7a

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: klencod-pty-libraries
          path: |
            klencod-pty-libraries.zip
            dist/arm64-v8a/libklencod_pty.so
            dist/armeabi-v7a/libklencod_pty.so
          if-no-files-found: error
